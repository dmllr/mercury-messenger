baseURL = 'https://eillance.com/'
languageCode = 'en-us'
title = 'Eillance'


[module]

  [[module.imports]]
    path = "github.com/foxihd/hugo-brewm"
    disable=false

  theme = "hugo-brewm"

canonifyURLs = true
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true
enableMissingTranslationPlaceholders = true
ignoreFiles = ['\.bak$', '\.redacted$']
ignoreLogs = []
copyright = 'Copyright (c) Denis Miller'

[markup]
  [markup.highlight]
    codeFences = true
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    tabWidth = 2

  [markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true

[frontmatter]
    date = ['tanggal', ':default']
    expiryDate = ['redacted', 'kadaluwarsa', 'ditarik', ':default']
    lastmod = ['errata', 'addendum', "lastmod", 'disunting', 'diubah', ':default']
