[package]
name = "eillance_libp2p"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
libp2p = { version = "0.53", features =["tokio", "tcp", "noise", "yamux", "kad", "relay", "macros", "request-response", "cbor", "mdns", "identify", "ping", "dcutr", "autonat"] }
tokio = { version = "1.32", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
rand = "0.10.1"
turn = "0.7"
webrtc-util = "0.8"
async-trait = "0.1"
