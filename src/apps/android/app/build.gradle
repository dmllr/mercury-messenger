plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.10'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.10'
    id 'kotlin-parcelize'
}

def findGitRoot = { startDir ->
    def dir = startDir
    while (dir != null && !new File(dir, '.git').exists()) {
        dir = dir.getParentFile()
    }
    if (dir == null) {
        throw new GradleException("Could not find .git root from " + startDir)
    }
    return dir
}
def repoRoot = findGitRoot(project.projectDir)

Properties keystoreProps = new Properties()
def keystoreConfigFile = new File(repoRoot, 'keystore.config')

if (keystoreConfigFile.exists()) {
    keystoreProps.load(new FileInputStream(keystoreConfigFile))
} else {
    throw new GradleException("""
        Keystore configuration file 'keystore.config' not found. 
        
        Please create a file named 'keystore.config' in the root of the repository.
        
        Add the following properties to the file, replacing the placeholders with your actual keystore information:
        
        storeFile=<path_to_your_keystore_file>
        storePassword=<your_keystore_password>
        keyAlias=<your_key_alias>
        keyPassword=<your_key_password>
    """)
}

Properties versionProps = new Properties()
def versionPropsFile = new File(repoRoot, 'version.properties')
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}
def vCode = (versionProps['VERSION_CODE'] ?: "0").toInteger()
def runTasks = gradle.startParameter.taskNames
if (runTasks.any { it.contains('bundleRelease') || it.contains('assembleRelease') }) {
    vCode++
    versionProps['VERSION_CODE'] = vCode.toString()
    versionProps.store(versionPropsFile.newWriter(), null)
}

android {
    signingConfigs {
        debug {
            storeFile file(keystoreProps['storeFile'])
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
        release {
            storeFile file(keystoreProps['storeFile'])
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
    }

    compileSdk 36

    defaultConfig {
        applicationId "hela.eillance"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode vCode
        versionName "1.0.${vCode}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            externalNativeBuild {
                cmake {
                    // arguments "-DANDROID_STL=c++_shared"
                }
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
    buildFeatures {
        compose true
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packagingOptions {
        resources.excludes.add("META-INF/*")
        resources.excludes.add("META-INF/AL2.0")
        resources.excludes.add("META-INF/LGPL2.1")
        resources.excludes.add("META-INF/plexus/*")
        resources.excludes.add("META-INF/sisu/*")
        resources.excludes.add("licenses/*")
    }
    namespace 'hela.eillance.camera'
    ndkVersion '29.0.13113456 rc1'
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

