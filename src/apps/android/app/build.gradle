plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'

    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.20'
}

Properties keystoreProps = new Properties()
def keystoreConfigFile = file('keystore.config')

if (keystoreConfigFile.exists()) {
    keystoreProps.load(new FileInputStream(keystoreConfigFile))
} else {
    throw new GradleException("""
        Keystore configuration file 'keystore.config' not found. 
        
        Please create a file named 'keystore.config' in the root of your module directory.
        
        Add the following properties to the file, replacing the placeholders with your actual keystore information:
        
        storeFile=<path_to_your_keystore_file>
        storePassword=<your_keystore_password>
        keyAlias=<your_key_alias>
        keyPassword=<your_key_password>
    """)
}

Properties versionProps = new Properties()
def versionPropsFile = file('version.properties')
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}
def vCode = (versionProps['VERSION_CODE'] ?: "0").toInteger()
def runTasks = gradle.startParameter.taskNames
if (runTasks.toString().contains('bundleRelease')) {
    vCode++
    versionProps['VERSION_CODE'] = vCode.toString()
    versionProps.store(versionPropsFile.newWriter(), null)
}

android {
    signingConfigs {
        debug {
            storeFile file(keystoreProps['storeFile'])
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
        release {
            storeFile file(keystoreProps['storeFile'])
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
    }

    compileSdk 35

    defaultConfig {
        applicationId "hela.eillance"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
//            abiFilters 'x86_64', 'arm64-v8a'
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.7"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packagingOptions {
        resources.excludes.add("META-INF/*")
        resources.excludes.add("META-INF/plexus/*")
        resources.excludes.add("META-INF/sisu/*")
        resources.excludes.add("licenses/*")
    }
    namespace 'hela.eillance.camera'
    ndkVersion '29.0.13113456 rc1'
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.20'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation 'com.firebaseui:firebase-ui-auth:9.0.0'

    implementation 'org.apache.maven.plugins:maven-compiler-plugin:3.14.0'

    implementation 'androidx.test.ext:junit-gtest:1.0.0-alpha02'
    implementation 'com.android.ndk.thirdparty:googletest:1.11.0-beta-1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.03.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-runtime-ktx:2.8.9'
    implementation 'androidx.navigation:navigation-compose:2.8.9'
    implementation 'androidx.compose.runtime:runtime-livedata:1.7.8'
    implementation "androidx.constraintlayout:constraintlayout-compose:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "io.coil-kt:coil-compose:2.6.0"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.03.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

apply plugin: 'com.google.gms.google-services'