}

// Translation
tasks.register('generateTranslations', Exec) {
    description = "Generates Android string resources from .po files"
    group = "build"

    def gitRoot = providers.exec {
        commandLine 'git', 'rev-parse', '--show-toplevel'
    }.standardOutput.asText.map { it.trim() }

    // Inputs: The .po directory
    inputs.dir gitRoot.map { new File(it, "src/assets/translations") }

    // Outputs: The Android values directories.
    // Listing each language file is not strictly required, but helps Gradle verify integrity.
    outputs.files file("src/main/res/values/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-ar/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-de/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-es/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-fr/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-id/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-it/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-ja/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-ko/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-pt/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-ru/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-tr/strings-autogenerated.xml")
    outputs.files file("src/main/res/values-zh/strings-autogenerated.xml")

    executable 'python3'
    doFirst {
        args new File(gitRoot.get(), "tools/translations/generate.py").absolutePath
    }
}
preBuild.dependsOn generateTranslations

tasks.register('copySounds', Copy) {
    description = "Copies sound assets to Android resources"
    group = "build"

    def gitRoot = providers.exec {
        commandLine 'git', 'rev-parse', '--show-toplevel'
    }.standardOutput.asText.map { it.trim() }

    from gitRoot.map { new File(it, "src/assets/sounds") }
    into "src/main/res/raw"
    include "*.wav", "*.mp3", "*.ogg"
}
preBuild.dependsOn copySounds
