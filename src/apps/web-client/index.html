<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eillance Web</title>
    <!-- `sizes="any"` is to fix Chrome bug -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
        button {
            padding: 8px 16px;
        }

        pre {
            overflow-x: hidden;
            overflow-y: auto;
        }

        video {
            width: 100%;
        }

        .option {
            margin-bottom: 8px;
        }

        #media {
            max-width: 1280px;
        }

        .client-list {
            margin-bottom: 16px;
        }

        .select-container {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>

<h2>Available Clients</h2>
<button id="refresh" onclick="refreshPublishers()">Refresh Clients</button>
<div class="client-list" id="client-list"></div>

<button id="start" onclick="start()" disabled>Start</button>
<button id="stop" style="display: none" onclick="stop()">Stop</button>

<h2>Camera and Resolution</h2>
<div class="select-container">
    <label for="camera-select">Camera:</label>
    <select id="camera-select" onchange="onCameraChange()"></select>
    <label for="resolution-select">Resolution:</label>
    <select id="resolution-select" onchange="onResolutionChange()"></select>
</div>

<h2>State</h2>
<p>
    ICE gathering state: <span id="ice-gathering-state"></span>
</p>
<p>
    ICE connection state: <span id="ice-connection-state"></span>
</p>
<p>
    Signaling state: <span id="signaling-state"></span>
</p>

<div id="media" style="display: none">
    <h2>Media</h2>
    <video id="video" autoplay playsinline></video>
</div>

<h2>Data Channel</h2>
<pre id="data-channel" style="height: 200px;"></pre>

<h2>SDP</h2>

<h3>Offer</h3>
<pre id="offer-sdp"></pre>

<h3>Answer</h3>
<pre id="answer-sdp"></pre>

<script src="client.js"></script>

</body>
</html>
