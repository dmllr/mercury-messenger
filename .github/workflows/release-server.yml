name: Create Server Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build_and_release_server:
    name: Build Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang lld libssl-dev pkg-config go

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install go ninja openssl@3 pkg-config
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install cmake ninja go

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: microsoft/setup-msvc@v2
        with:
          architecture: x64

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build Server
        run: cmake --build build --config Release --target mercury-server

      - name: Prepare Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ARTIFACT_NAME="mercury-server-windows.zip"
          Compress-Archive -Path build/src/server/Release/mercury-server.exe -DestinationPath $ARTIFACT_NAME
          echo "ARTIFACT_PATH=$ARTIFACT_NAME" >> $env:GITHUB_ENV

      - name: Prepare Artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ARTIFACT_NAME="mercury-server-$(echo ${{ runner.os }} | tr '[:upper:]' '[:lower:]').tar.gz"
          strip build/src/server/mercury-server
          tar -czvf $ARTIFACT_NAME -C build/src/server mercury-server
          echo "ARTIFACT_PATH=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Upload Artifact to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.ARTIFACT_PATH }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
