name: Create Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build_and_release_apk:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src/apps/android/app/keystore.jks
          echo "storeFile=keystore.jks" > src/apps/android/app/keystore.config
          echo "storePassword=$KEYSTORE_PASSWORD" >> src/apps/android/app/keystore.config
          echo "keyAlias=$KEY_ALIAS" >> src/apps/android/app/keystore.config
          echo "keyPassword=$KEY_PASSWORD" >> src/apps/android/app/keystore.config

      - name: Make gradlew executable
        run: chmod +x ./src/apps/android/gradlew

      - name: Build the release APK
        working-directory: ./src/apps/android
        run: ./gradlew :app:assembleRelease

      - name: Create or Update GitHub Release and Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: "src/apps/android/app/build/outputs/apk/release/app-release.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
