<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- background -->
  <!--
  <rect width="100%" height="100%" fill="#0b1020"/>
  -->
  <!-- with soft vignette -->
  <radialGradient id="bgV" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#0b1020" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </radialGradient>
  <rect width="100%" height="100%" fill="url(#bgV)"/>


  <defs>
    <radialGradient id="sunG" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd04d"/>
      <stop offset="65%" stop-color="#ff9b1a"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </radialGradient>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>


  <!-- sun disk -->
  <g filter="url(#sunGlow)">
    <circle cx="256" cy="256" r="120" fill="url(#sunG)"/>
  </g>


  <!-- orbit -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6 6"/>


  <!-- Mercury (small with faint trail) -->
  <g>
    <circle cx="456" cy="256" r="24" fill="#b7c1cf" />
    <!-- trailing glow -->
    <ellipse cx="312" cy="256" rx="20" ry="8" fill="#b7c1cf" opacity="0.06"/>
  </g>
</svg>